name: CI

on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Allow Chromium's user-namespace sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install xdotool
        # The scroll capture e2e moves the real pointer into the captured region.
        run: sudo apt-get update && sudo apt-get install -y xdotool
      - name: End-to-end under Xvfb
        run: xvfb-run -a -s '-screen 0 1280x800x24' bun run test:e2e
      - name: Package (unpacked)
        run: bunx electron-builder --dir --linux
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
