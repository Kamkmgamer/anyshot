name: Website

# Builds site/ and publishes it to GitHub Pages. The download links and sizes come
# from the GitHub releases at build time, so the site is rebuilt when site/ changes,
# after every Release run, and whenever someone publishes, unpublishes or deletes a
# release by hand (such as publishing a draft the Release workflow made: that run
# finished before the release was public, and releases the workflow publishes itself
# don't send a release event, hence both triggers). The page also checks for newer
# releases when it loads. Pull requests that touch site/ only build it.
on:
  push:
    branches: ['main']
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_run:
    workflows: ['Release']
    types: [completed]
  release:
    types: [published, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    # After a Release run, only rebuild if it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event checks out its tag; build the current site instead.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
        env:
          # Reads the releases without the anonymous API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
