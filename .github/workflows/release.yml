name: Release

# Every push to main (except docs-only changes) builds the installers and publishes a
# release. Its version is package.json's if that isn't released yet, else the next patch
# after the latest release. A tag vX.Y.Z publishes exactly that version. Running it by
# hand builds the same files into a draft release to check first.
on:
  push:
    branches: ['main']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      draft: ${{ steps.pick.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          # Releases are plain X.Y.Z (no prereleases), so versions can be compared and bumped.
          plain='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! grep -qE "$plain" <<< "$pkg"; then
            echo "::error::package.json version $pkg is not X.Y.Z"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$pkg" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
              exit 1
            fi
          else
            # Every published release (all pages), X.Y.Z only; a draft doesn't use up its version.
            # A failed request stops the job (set -e); no X.Y.Z release yet is a valid empty list.
            tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | select(.draft | not) | .tag_name | ltrimstr("v")')
            released=$(grep -E "$plain" <<< "$tags" || true)
            latest=$(printf '%s\n%s\n' "$released" "$pkg" | grep . | sort -V | tail -1)
            if [ "$latest" = "$pkg" ] && ! grep -qx "$pkg" <<< "$released"; then
              # package.json was bumped (or nothing is released yet): use it as is.
              version="$pkg"
            else
              IFS=. read -r major minor patch <<< "$latest"
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          # Only pushes publish; a manual run stays a draft, even when started on a tag.
          if [ "$GITHUB_EVENT_NAME" = push ]; then draft=false; else draft=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "Building $version (draft: $draft)"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Stamp the version
        shell: bash
        run: jq --arg v "${{ needs.version.outputs.version }}" '.version = $v' package.json > p.json && mv p.json package.json
      # Native modules ship prebuilt per CPU: install both the x64 and the ARM64 one.
      - run: bun install --frozen-lockfile --cpu="*"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Package the x64 and ARM64 installers
        run: |
          bunx electron-builder --win nsis --x64 --publish never
          bunx electron-builder --win nsis --arm64 --publish never
      - name: Check each build carries its own screenshot module
        shell: bash
        run: |
          set -euo pipefail
          modules() { find "$1" -name 'node-screenshots.*.node' | sed 's#.*/##'; }
          modules dist/win-unpacked | grep -qx 'node-screenshots.win32-x64-msvc.node'
          modules dist/win-arm64-unpacked | grep -qx 'node-screenshots.win32-arm64-msvc.node'
          ls -l dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Stamp the version
        run: jq --arg v "${{ needs.version.outputs.version }}" '.version = $v' package.json > p.json && mv p.json package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Package the .deb and the AppImage
        run: bunx electron-builder --linux deb AppImage --x64 --publish never
      - name: Check the build carries the screenshot module
        run: |
          find dist/linux-unpacked -name 'node-screenshots.linux-x64-gnu.node' | grep -q .
          ls -l dist/*.deb dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ needs.version.outputs.version }}
          draft: ${{ needs.version.outputs.draft }}
        run: |
          set -euo pipefail
          tag="v$version"
          ls -l artifacts
          test "$(ls artifacts | wc -l)" -eq 4
          {
            sed "s/{{version}}/$version/g" .github/release-notes.md
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq .body
          } > notes.md
          existing=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$existing" = none ]; then
            gh release create "$tag" artifacts/* --title "anyshot $version" \
              --notes-file notes.md --target "$GITHUB_SHA" --draft="$draft"
          elif [ "$existing" = true ]; then
            # A draft (from a manual run): refresh its files and notes; a push publishes it.
            gh release upload "$tag" artifacts/* --clobber
            gh release edit "$tag" --title "anyshot $version" --notes-file notes.md \
              --target "$GITHUB_SHA" --draft="$draft"
          else
            echo "::error::$tag is already published"
            exit 1
          fi
          gh release view "$tag" --json url,isDraft,assets --jq '{url, isDraft, assets: [.assets[].name]}'
