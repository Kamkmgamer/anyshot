appId: dev.anyshot.app
productName: anyshot
copyright: Copyright © 2026 anyshot contributors
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  # Only the compact English OCR model ships; the larger variant is excluded.
  - '!node_modules/@tesseract.js-data/eng/4.0.0/**'
  - '!**/*.{md,map,ts,tsx}'
  # Windows release builds install the x64 and ARM64 screenshot modules; 32-bit isn't shipped.
  - '!node_modules/node-screenshots-win32-ia32-msvc/**'
extraResources:
  - from: resources
    to: .
    filter: ['tray*.png', 'icon*.png']
# Native modules can't load from inside the asar archive.
asarUnpack:
  - '**/*.node'
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  shortcutName: anyshot
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Graphics
  icon: resources/icon.png
  synopsis: Lean screenshots, annotation and screen recording
  description: Capture, annotate, pin, record and upload screenshots. Built with Electron.
  executableArgs: []
  desktop:
    entry:
      Name: anyshot
      Comment: Screenshots, annotation and screen recording
      Categories: Graphics;Utility;
      StartupWMClass: anyshot
appImage:
  artifactName: ${productName}-${version}-x86_64.${ext}
deb:
  artifactName: ${productName}_${version}_amd64.${ext}
  depends: [libnss3, libgtk-3-0, libxss1, libxtst6, libnotify4, libsecret-1-0]
